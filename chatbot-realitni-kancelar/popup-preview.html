<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Náhled pop-upu</title>
</head>
<body>

<script type="text/javascript">
  (function(d, t) {
      var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
      v.onload = function() {
        window.voiceflow.chat.load({
          verify: { projectID: '6a7f72bc44db7f81c4c88c9b' },
          url: 'https://general-runtime.voiceflow.com',
          voice: {
            url: "https://runtime-api.voiceflow.com"
          }
        }).then(function() {

          var POPUP_TEXT = '👋 Máte dotaz k nemovitosti? Zeptejte se, poradíme hned.';
          var POPUP_DELAY = 5000;
          var STORAGE_KEY = 'vfPopupDismissedAt';

          // Jen v NÁHLEDU: při každém otevření souboru zapomeň předchozí zavření,
          // ať se bublina ukáže spolehlivě pokaždé, i po dřívějším testování.
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}

          var chatOpened = false;

          function oznacitJakoZavrenou() {
            try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (e) {}
          }
          function removeBubble() {
            var b = d.getElementById('vf-custom-popup');
            if (b) b.remove();
          }

          try {
            window.voiceflow.chat.on('open', function() {
              chatOpened = true;
              removeBubble();
              oznacitJakoZavrenou();
            });
            window.voiceflow.chat.on('close', function() {
              chatOpened = false;
            });
          } catch (e) {}

          d.addEventListener('click', function(e) {
            if (e.target && (e.target.id === 'voiceflow-chat' || e.target.closest('#voiceflow-chat'))) {
              chatOpened = true;
              removeBubble();
              oznacitJakoZavrenou();
            }
          }, true);

          setInterval(function() {
            var frame = d.getElementById('voiceflow-chat-frame');
            var open = frame && frame.offsetHeight > 150;
            if (open && !chatOpened) {
              chatOpened = true;
              removeBubble();
              oznacitJakoZavrenou();
            } else if (!open) {
              chatOpened = false;
            }
          }, 700);

          setTimeout(function() {
            if (chatOpened) return;
            var frame = d.getElementById('voiceflow-chat-frame');
            if (frame && frame.offsetHeight > 150) return;

            var bubble = d.createElement('div');
            bubble.id = 'vf-custom-popup';
            bubble.setAttribute('role', 'button');
            bubble.setAttribute('tabindex', '0');
            bubble.setAttribute('aria-label', 'Otevřít chat');
            bubble.innerHTML = POPUP_TEXT +
              '<span id="vf-close-popup" aria-label="Zavřít" style="position:absolute;top:4px;right:10px;width:20px;height:20px;font-size:18px;color:#94a3b8;font-family:Arial,sans-serif;font-weight:bold;line-height:1;cursor:pointer;">&times;</span>' +
              '<span style="position:absolute;bottom:-8px;right:24px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #16243B;"></span>';

            bubble.style.cssText =
              'position:fixed;right:24px;bottom:calc(100px + env(safe-area-inset-bottom, 0px));' +
              'max-width:270px;background:#16243B;color:#ffffff;padding:14px 38px 14px 16px;' +
              'border-radius:14px 14px 4px 14px;font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;' +
              'box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer;z-index:999998;' +
              'opacity:0;transform:translateY(8px);transition:opacity .35s ease, transform .35s ease;';

            if (window.innerWidth <= 480) {
              bubble.style.left = '12px';
              bubble.style.right = '12px';
              bubble.style.maxWidth = 'none';
              bubble.style.bottom = 'calc(84px + env(safe-area-inset-bottom, 0px))';
              bubble.style.borderRadius = '14px 14px 14px 4px';
            }

            d.body.appendChild(bubble);

            setTimeout(function() {
              if (!chatOpened) {
                bubble.style.opacity = '1';
                bubble.style.transform = 'translateY(0)';
              }
            }, 20);

            var closeBtn = bubble.querySelector('#vf-close-popup');
            closeBtn.onmouseover = function() { this.style.color = '#ffffff'; };
            closeBtn.onmouseout = function() { this.style.color = '#94a3b8'; };
            closeBtn.onclick = function(e) {
              e.stopPropagation();
              removeBubble();
              oznacitJakoZavrenou();
            };
            bubble.onclick = function() {
              window.voiceflow.chat.open();
              removeBubble();
              oznacitJakoZavrenou();
            };
            bubble.onkeydown = function(e) {
              if (e.key === 'Enter' || e.key === ' ') bubble.click();
            };
          }, POPUP_DELAY);

        });
      }
      v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
  })(document, 'script');
</script>

</body>
</html>
